name: ACL AI end-to-end integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ml/acl_*.py"
      - "ml/generate_synthetic_acl_fixture.py"
      - "lib/acl/**"
      - "data/acl-*.json"
      - "components/research/AclRiskWorkbench.tsx"
      - "app/research/acl-risk-ai/**"
      - ".github/workflows/acl-ai-integration.yml"

permissions:
  contents: read

concurrency:
  group: acl-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acl-only-research-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install research dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Generate ACL-only synthetic integration cohort
        run: |
          python ml/generate_synthetic_acl_fixture.py /tmp/acl-fixture.csv \
            --participants 240 \
            --seed 20260922

      - name: Train and evaluate ACL-only machine-learning candidates
        run: |
          python ml/acl_injury_benchmark.py \
            /tmp/acl-fixture.csv \
            /tmp/acl-benchmark.json \
            /tmp/acl-model.joblib \
            --bootstrap-samples 100

      - name: Verify ACL outcome and clinical safeguards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/acl-benchmark.json').read_text())
          assert report['target'] == 'acl_tear_within_horizon'
          assert report['aclCohortAudit']['directContactExcluded'] is True
          assert report['aclCohortAudit']['medicalConfirmationVerified'] is True
          assert report['modeling']['nestedParticipantGrouped'] is True
          assert report['deploymentGate']['eligibleForUserFacingAclProbability'] is False
          assert report['validation']['externalValidated'] is False
          assert 'video_biomechanics' in report['featureDomains']
          assert 'acl_history' in report['featureDomains']
          assert 'exposure_fatigue' in report['featureDomains']
          print(json.dumps({
              'participants': report['aclCohortAudit']['nParticipants'],
              'positiveParticipants': report['aclCohortAudit']['nPositiveParticipants'],
              'championFamily': report['modeling']['championFamily'],
              'auroc': report['validation']['metrics']['auroc'],
              'clinicalProbabilityEnabled': report['deploymentGate']['eligibleForUserFacingAclProbability'],
              'syntheticIntegrationOnly': True,
          }, indent=2))
          PY

      - name: Upload ACL integration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acl-only-synthetic-integration
          retention-days: 14
          path: |
            /tmp/acl-benchmark.json
            /tmp/acl-model.joblib
