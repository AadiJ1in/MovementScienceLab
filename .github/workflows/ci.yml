name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install research pipeline dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Validate Python research pipeline syntax
        run: python -m compileall -q ml
      - name: Test prospective injury benchmark safeguards
        run: python -m unittest discover -s ml -p 'test_*.py'
      - name: Validate canonical model-data feature contract
        run: python ml/feature_contract_report.py > /tmp/model-feature-contract.json
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Smoke-test production server
        run: pnpm smoke:production
