name: Inspect prospective running-injury dataset

on:
  push:
    branches: [ai-development]
    paths:
      - "ml/inspect_prospective_running_injury_data.py"
      - "ml/requirements.txt"
      - ".github/workflows/inspect-prospective-running-injury.yml"
  workflow_dispatch:

jobs:
  inspect-running-injury-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install research dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Download peer-reviewed prospective injury data
        run: |
          mkdir -p .research-data/running-injury .research-output
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41746-026-02413-y/MediaObjects/41746_2026_2413_MOESM2_ESM.xlsx" \
            -o .research-data/running-injury/supplementary-data1.xlsx
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41746-026-02413-y/MediaObjects/41746_2026_2413_MOESM3_ESM.xlsx" \
            -o .research-data/running-injury/supplementary-data2.xlsx
          python - <<'PY'
          from pathlib import Path
          for path in Path('.research-data/running-injury').glob('*.xlsx'):
              data = path.read_bytes()
              assert len(data) > 100_000, (path, len(data))
              assert data[:2] == b'PK', f'{path} is not a valid XLSX/ZIP payload'
              print(path, len(data))
          PY
      - name: Inspect workbook schema before modeling
        run: |
          python ml/inspect_prospective_running_injury_data.py \
            .research-data/running-injury/supplementary-data1.xlsx \
            .research-data/running-injury/supplementary-data2.xlsx \
            --output .research-output/prospective-running-injury-schema.json
      - name: Guard against premature clinical promotion
        run: |
          python - <<'PY'
          import json
          report = json.load(open('.research-output/prospective-running-injury-schema.json'))
          assert report['source']['clinical_deployment_blocked'] is True
          assert report['source']['license'] == 'CC BY 4.0'
          assert report['source']['published_samples'] == 6181
          assert report['source']['published_injury_instances'] == 564
          assert len(report['workbooks']) == 2
          print('Prospective injury source passed provenance/schema inspection gate.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-running-injury-schema
          path: .research-output/prospective-running-injury-schema.json
          retention-days: 14
