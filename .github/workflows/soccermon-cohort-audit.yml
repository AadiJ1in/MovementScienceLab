name: SoccerMon prospective cohort audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ml/soccermon_reference.py"
      - "ml/data_source_matrix.py"
      - "ml/artifact_provenance.py"
      - "data/data-source-matrix.json"
      - "data/research-source-intake-matrix.json"
      - ".github/workflows/soccermon-cohort-audit.yml"

permissions:
  contents: read

jobs:
  cohort-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install research dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Download published SoccerMon subjective archive
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/soccermon-subjective.zip \
            "https://zenodo.org/records/10033832/files/subjective.zip?download=1"
          echo "a3e86aeca611f77c9331a535eae00bf7  /tmp/soccermon-subjective.zip" | md5sum -c -
          mkdir -p /tmp/soccermon
          unzip -q /tmp/soccermon-subjective.zip -d /tmp/soccermon

      - name: Build pre-specified 28-day non-overlapping cohort
        run: |
          python ml/soccermon_reference.py build-cohort \
            /tmp/soccermon \
            /tmp/soccermon-cohort.csv \
            /tmp/soccermon-cohort-metadata.json \
            --horizon-days 28 \
            --stride-days 28 \
            --wellness-lookback-days 3

      - name: Run prospective timing audit and descriptive information report
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          import pandas as pd

          sys.path.insert(0, "ml")
          from prospective_cohort_audit import audit_csv

          cohort_path = Path("/tmp/soccermon-cohort.csv")
          audit = audit_csv(cohort_path, horizon_days=28)
          Path("/tmp/soccermon-cohort-audit.json").write_text(
              json.dumps(audit, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          if not audit["passed"]:
              raise SystemExit("Prospective cohort timing audit failed: " + "; ".join(audit["errors"]))

          df = pd.read_csv(cohort_path)
          participant_outcomes = df.groupby("participant_id")["injury_within_horizon"].max().astype(int)
          predictor_columns = [
              "previous_injury_count",
              "days_since_last_injury",
              "session_rpe_load_7d",
              "session_rpe_load_28d",
              "soreness_score",
              "sleep_quality_score",
              "readiness_score",
          ]
          summary = {
              "schemaVersion": "1.0.0",
              "purpose": "information audit before any SoccerMon model fitting",
              "modelWasFit": False,
              "horizonDays": 28,
              "nRows": int(len(df)),
              "nParticipants": int(df["participant_id"].nunique()),
              "nParticipantsWithAtLeastOnePositiveWindow": int(participant_outcomes.sum()),
              "nParticipantsWithoutPositiveWindow": int((participant_outcomes == 0).sum()),
              "nPositiveWindows": int(df["injury_within_horizon"].sum()),
              "nNegativeWindows": int((df["injury_within_horizon"] == 0).sum()),
              "windowPrevalence": float(df["injury_within_horizon"].mean()),
              "participantsBySite": {
                  str(key): int(value)
                  for key, value in df.groupby("site_id")["participant_id"].nunique().items()
              },
              "positiveWindowsBySite": {
                  str(key): int(value)
                  for key, value in df.groupby("site_id")["injury_within_horizon"].sum().items()
              },
              "fractionMissingByPredictor": {
                  column: float(df[column].isna().mean())
                  for column in predictor_columns
              },
              "note": (
                  "No model is fit in this workflow. These counts are intended to inform a pre-specified "
                  "data-adequacy/sample-size decision before inspecting predictive performance."
              ),
          }
          Path("/tmp/soccermon-information-summary.json").write_text(
              json.dumps(summary, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Stamp source and data-piece provenance
        run: |
          COMMON_ARGS=(
            --source soccermon
            --data-piece soccermon-daily-load
            --data-piece soccermon-readiness
            --data-piece soccermon-sleep-quality
            --data-piece soccermon-soreness
            --data-piece soccermon-injury-event
            --data-piece prospective-history-domain
            --data-piece prospective-symptoms-readiness-domain
            --data-piece prospective-training-exposure-domain
            --data-piece prospective-outcome-and-timing
          )

          python ml/artifact_provenance.py \
            /tmp/soccermon-cohort-metadata.json \
            /tmp/soccermon-cohort-metadata.json \
            "${COMMON_ARGS[@]}" \
            --input-file /tmp/soccermon-subjective.zip

          python ml/artifact_provenance.py \
            /tmp/soccermon-cohort-audit.json \
            /tmp/soccermon-cohort-audit.json \
            "${COMMON_ARGS[@]}" \
            --input-file /tmp/soccermon-cohort.csv

          python ml/artifact_provenance.py \
            /tmp/soccermon-information-summary.json \
            /tmp/soccermon-information-summary.json \
            "${COMMON_ARGS[@]}" \
            --input-file /tmp/soccermon-cohort.csv

          python ml/data_source_matrix.py \
            --provenance-source soccermon \
            --data-piece soccermon-daily-load \
            --data-piece soccermon-readiness \
            --data-piece soccermon-sleep-quality \
            --data-piece soccermon-soreness \
            --data-piece soccermon-injury-event \
            --data-piece prospective-outcome-and-timing \
            > /tmp/soccermon-source-provenance.json

      - name: Upload cohort audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soccermon-28d-cohort-audit
          retention-days: 30
          path: |
            /tmp/soccermon-cohort.csv
            /tmp/soccermon-cohort-metadata.json
            /tmp/soccermon-cohort-audit.json
            /tmp/soccermon-information-summary.json
            /tmp/soccermon-source-provenance.json
