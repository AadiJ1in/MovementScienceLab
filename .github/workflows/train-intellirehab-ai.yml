name: Train IntelliRehab open validation AI

on:
  push:
    branches: [ai-development]
    paths:
      - "ml/build_intellirehab_features.py"
      - "ml/train_multiexercise_models.py"
      - "ml/benchmark_task_models.py"
      - "ml/nested_grouped_task_evaluation.py"
      - ".github/workflows/train-intellirehab-ai.yml"
      - "docs/dataset-registry.json"
  workflow_dispatch:

jobs:
  train-intellirehab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Download IntelliRehab skeleton data from Zenodo
        run: |
          mkdir -p .research-data/intellirehab
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://zenodo.org/records/4610859/files/SkeletonData.zip?download=1" \
            -o .research-data/intellirehab/SkeletonData.zip
          unzip -q .research-data/intellirehab/SkeletonData.zip -d .research-data/intellirehab/skeleton
          test "$(find .research-data/intellirehab/skeleton -type f -name '*.txt' | wc -l)" -gt 100
      - name: Build leakage-resistant biomechanics features
        run: |
          python ml/build_intellirehab_features.py \
            .research-data/intellirehab/skeleton \
            .research-output/intellirehab-features.csv
      - name: Train exercise-specific subject-grouped models
        run: |
          python ml/train_multiexercise_models.py \
            .research-output/intellirehab-features.csv \
            .research-output/intellirehab-models.json \
            --source-dataset IntelliRehabDS \
            --no-commercial-use-blocked
      - name: Benchmark nonlinear and interpretable model families per task
        run: |
          python ml/benchmark_task_models.py \
            .research-output/intellirehab-features.csv \
            .research-output/intellirehab-benchmarks.json
      - name: Run nested participant-grouped model and threshold selection
        run: |
          python ml/nested_grouped_task_evaluation.py \
            .research-output/intellirehab-features.csv \
            .research-output/intellirehab-nested-evaluation.json
      - name: Validate source and model integrity
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          df = pd.read_csv('.research-output/intellirehab-features.csv')
          model = json.load(open('.research-output/intellirehab-models.json'))
          benchmark = json.load(open('.research-output/intellirehab-benchmarks.json'))
          nested = json.load(open('.research-output/intellirehab-nested-evaluation.json'))
          assert df['subject_id'].nunique() >= 20, df['subject_id'].nunique()
          assert set(df['label'].unique()).issubset({0, 1})
          first = next(m for m in model['models'] if m['status'] == 'trained-research-only')
          assert 'repetition' not in first['features']
          assert 'session_id' not in first['features']
          assert len([t for t in benchmark['tasks'] if t['status'] == 'benchmarked']) >= 8
          nested_tasks = [t for t in nested['tasks'] if t['status'] == 'nested-evaluated']
          assert len(nested_tasks) >= 8
          print(df.groupby('exercise_id').agg(reps=('label','size'), subjects=('subject_id','nunique'), deviation_rate=('label','mean')).to_string())
          for task in benchmark['tasks']:
              if task['status'] == 'benchmarked':
                  print('BENCHMARK', task['exerciseName'], task['recommendedResearchModel'], task['recommendedMetrics'])
          for task in nested_tasks:
              print('NESTED', task['exerciseName'], task['metrics'], task['selectedModelCounts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: intellirehab-open-movement-quality-models
          path: .research-output/
          include-hidden-files: true
          retention-days: 14

# IntelliRehabDS is used here as open labeled movement-quality evidence.
# Correct/incorrect labels are not injury outcomes and must never be presented
# as diagnosis or future-injury probabilities. Participant-level splitting remains mandatory.
