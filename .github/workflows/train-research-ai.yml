name: Train research movement-quality AI

on:
  push:
    branches: [ai-development]
    paths:
      - "ml/**"
      - "lib/ai/**"
      - ".github/workflows/train-research-ai.yml"
  workflow_dispatch:

jobs:
  train-rehab24:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Download REHAB24-6 segmented 2D research subset
        run: |
          mkdir -p .research-data/rehab24
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/jessicaxtang/ExerciseLLM/main/dataset/REHAB24-6/2d_joints_segmented.zip" \
            -o .research-data/rehab24/2d_joints_segmented.zip
          unzip -q .research-data/rehab24/2d_joints_segmented.zip -d .research-data/rehab24
          find .research-data/rehab24 -name annotations.csv -print
      - name: Build squat rep features
        run: |
          ROOT=$(dirname "$(find .research-data/rehab24 -name annotations.csv -print -quit)")
          test -n "$ROOT"
          python ml/build_rehab24_squat_features.py "$ROOT" .research-output/rehab24-squat-features.csv
      - name: Benchmark candidate squat model families with subject-grouped CV
        run: |
          python ml/benchmark_models.py \
            .research-output/rehab24-squat-features.csv \
            .research-output/rehab24-squat-benchmark.json
      - name: Train calibrated interpretable squat candidate
        run: |
          python ml/train_interpretable_model.py \
            .research-output/rehab24-squat-features.csv \
            .research-output/rehab24-squat-model.json
      - name: Build static all-exercise kinematic features
        run: |
          ROOT=$(dirname "$(find .research-data/rehab24 -name annotations.csv -print -quit)")
          python ml/build_rehab24_multiexercise_features.py \
            "$ROOT" \
            .research-output/rehab24-all-exercises.csv
      - name: Train static task-specific models
        run: |
          python ml/train_multiexercise_models.py \
            .research-output/rehab24-all-exercises.csv \
            .research-output/rehab24-multiexercise-models.json
      - name: Build phase-normalized temporal features
        run: |
          ROOT=$(dirname "$(find .research-data/rehab24 -name annotations.csv -print -quit)")
          python ml/build_rehab24_temporal_features.py \
            "$ROOT" \
            .research-output/rehab24-temporal-features.csv
      - name: Train temporal task-specific models
        run: |
          python ml/train_multiexercise_models.py \
            .research-output/rehab24-temporal-features.csv \
            .research-output/rehab24-temporal-models.json
      - name: Compare static and temporal validation
        run: |
          python - <<'PY'
          import json
          static = json.load(open('.research-output/rehab24-multiexercise-models.json'))
          temporal = json.load(open('.research-output/rehab24-temporal-models.json'))
          def compact(payload):
              return {
                  m['exerciseName']: {
                      'auroc': m.get('validation', {}).get('auroc'),
                      'balancedAccuracy': m.get('validation', {}).get('balancedAccuracy'),
                      'sensitivity': m.get('validation', {}).get('sensitivity'),
                      'specificity': m.get('validation', {}).get('specificity'),
                      'nFeatures': len(m.get('features', [])),
                  }
                  for m in payload['models'] if m.get('status') == 'trained-research-only'
              }
          print(json.dumps({'static': compact(static), 'temporal': compact(temporal)}, indent=2))
          PY
      - name: Print validation report
        run: |
          python - <<'PY'
          import json
          model = json.load(open('.research-output/rehab24-squat-model.json'))
          benchmark = json.load(open('.research-output/rehab24-squat-benchmark.json'))
          print(json.dumps(benchmark, indent=2))
          print(json.dumps(model['validation'], indent=2))
          print(json.dumps(model['deploymentGate'], indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rehab24-movement-quality-research-models
          path: .research-output/
          include-hidden-files: true
          retention-days: 14

# REHAB24-6 is licensed for academic/non-profit noncommercial research use.
# This workflow is for research evaluation only. Its artifacts must not be
# shipped as commercial production models without separate permission,
# independent external validation, and webcam-domain validation.
